name: Platform server CI

on:
  push:
    paths:
      - "platform-server/**"
      - ".github/workflows/platform-server-ci.yml"
  pull_request:
    paths:
      - "platform-server/**"
      - ".github/workflows/platform-server-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-server
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
