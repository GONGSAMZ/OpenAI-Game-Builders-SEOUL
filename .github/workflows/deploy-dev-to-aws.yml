name: Deploy DEV to AWS

on:
  push:
    branches: [DEV]
    paths:
      - "BungeoppangTycoon/**"
      - "platform-server/**"
      - "infra/aws/**"
      - ".github/workflows/deploy-dev-to-aws.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev-to-aws
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      AWS_TASK_EXECUTION_ROLE_ARN: ${{ vars.AWS_TASK_EXECUTION_ROLE_ARN }}
      AWS_TASK_ROLE_ARN: ${{ vars.AWS_TASK_ROLE_ARN }}
      AWS_DYNAMODB_TABLE: ${{ vars.AWS_DYNAMODB_TABLE }}
      AWS_RUNTIME_SECRET_ARN: ${{ vars.AWS_RUNTIME_SECRET_ARN }}
      UNITY_CI_ENABLED: ${{ vars.UNITY_CI_ENABLED || 'false' }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - id: check
        shell: bash
        run: |
          missing=()
          for name in AWS_ROLE_ARN AWS_REGION AWS_ECR_REPOSITORY AWS_TASK_EXECUTION_ROLE_ARN AWS_TASK_ROLE_ARN AWS_DYNAMODB_TABLE AWS_RUNTIME_SECRET_ARN; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if [[ "$UNITY_CI_ENABLED" == "true" ]]; then
            for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
              if [[ -z "${!name}" ]]; then missing+=("$name"); fi
            done
          fi
          if (( ${#missing[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### AWS 배포 설정 대기" >> "$GITHUB_STEP_SUMMARY"
            echo "누락: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      AWS_TASK_EXECUTION_ROLE_ARN: ${{ vars.AWS_TASK_EXECUTION_ROLE_ARN }}
      AWS_TASK_ROLE_ARN: ${{ vars.AWS_TASK_ROLE_ARN }}
      AWS_DYNAMODB_TABLE: ${{ vars.AWS_DYNAMODB_TABLE }}
      AWS_RUNTIME_SECRET_ARN: ${{ vars.AWS_RUNTIME_SECRET_ARN }}
      AWS_SERVICE_STACK: openai-game-builders-seoul-service
      # AAA111 production Web Login credentials are stored server-side in Secrets Manager.
      HIVE_MODE: production
      STORE_MODE: ${{ vars.STORE_MODE || 'mock' }}
      HIVE_WEB_SHOP_URL: ${{ vars.HIVE_WEB_SHOP_URL }}
      OPENAI_MODE: ${{ vars.OPENAI_MODE || 'mock' }}
      USE_RUNTIME_SECRETS: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Build Unity 6.3 WebGL
        if: vars.UNITY_CI_ENABLED == 'true'
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: BungeoppangTycoon
          unityVersion: 6000.3.22f1
          targetPlatform: WebGL
          buildMethod: WebGLBuildCommand.Build

      - name: Stage Unity build in the server image
        if: vars.UNITY_CI_ENABLED == 'true'
        shell: bash
        run: |
          test -f BungeoppangTycoon/Builds/WebGL/index.html
          grep -q '/game-bridge.js' BungeoppangTycoon/Builds/WebGL/index.html
          find platform-server/game-dist -mindepth 1 -maxdepth 1 ! -name README.md -exec rm -rf {} +
          cp -R BungeoppangTycoon/Builds/WebGL/. platform-server/game-dist/

      - name: Validate tracked Unity WebGL build
        if: vars.UNITY_CI_ENABLED != 'true'
        shell: bash
        run: |
          test -f platform-server/game-dist/index.html
          grep -q '/game-bridge.js' platform-server/game-dist/index.html

      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform-server/pnpm-lock.yaml
      - name: Verify platform server
        working-directory: platform-server
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image_uri="$ECR_REGISTRY/$AWS_ECR_REPOSITORY:$GITHUB_SHA"
          docker build --file platform-server/Dockerfile --tag "$image_uri" .
          docker push "$image_uri"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Deploy ECS Fargate service
        shell: bash
        run: |
          aws cloudformation deploy \
            --stack-name "$AWS_SERVICE_STACK" \
            --template-file infra/aws/service.yml \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ImageUri=$IMAGE_URI" \
              "TaskExecutionRoleArn=$AWS_TASK_EXECUTION_ROLE_ARN" \
              "TaskRoleArn=$AWS_TASK_ROLE_ARN" \
              "DynamoDbTable=$AWS_DYNAMODB_TABLE" \
              "RuntimeSecretArn=$AWS_RUNTIME_SECRET_ARN" \
              "UseRuntimeSecrets=$USE_RUNTIME_SECRETS" \
              "HiveMode=$HIVE_MODE" \
              "StoreMode=$STORE_MODE" \
              "HiveWebShopUrl=$HIVE_WEB_SHOP_URL" \
              "OpenAiMode=$OPENAI_MODE"

      - name: Verify public endpoint
        shell: bash
        run: |
          public_url=$(aws cloudformation describe-stacks \
            --stack-name "$AWS_SERVICE_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='PublicUrl'].OutputValue" \
            --output text)
          curl --fail --show-error --retry 12 --retry-delay 10 --retry-all-errors "$public_url/api/v1/health"
          echo "### 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "$public_url" >> "$GITHUB_STEP_SUMMARY"
