AWSTemplateFormatVersion: "2010-09-09"
Description: OpenAI Game Builders - ECS Fargate, ALB and CloudFront service

Parameters:
  ImageUri:
    Type: String
  TaskExecutionRoleArn:
    Type: String
  TaskRoleArn:
    Type: String
  DynamoDbTable:
    Type: String
  RuntimeSecretArn:
    Type: String
    Default: ""
  UseRuntimeSecrets:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  HiveMode:
    Type: String
    AllowedValues: [mock, sandbox, production]
    Default: mock
  StoreMode:
    Type: String
    AllowedValues: [mock, hive-web-shop]
    Default: mock
  HiveWebShopUrl:
    Type: String
    Default: ""
  OpenAiMode:
    Type: String
    AllowedValues: [mock, live]
    Default: mock

Conditions:
  HasHiveRuntimeSecrets: !And
    - !Equals [!Ref UseRuntimeSecrets, "true"]
    - !Not [!Equals [!Ref HiveMode, mock]]
  HasOpenAiRuntimeSecrets: !And
    - !Equals [!Ref UseRuntimeSecrets, "true"]
    - !Equals [!Ref OpenAiMode, live]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.44.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: openai-game-builders-seoul }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.44.1.0/24
      MapPublicIpOnLaunch: true
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.44.2.0/24
      MapPublicIpOnLaunch: true
  RouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA
  RouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP for CloudFront origin
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS traffic from the ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref Vpc
      HealthCheckPath: /api/v1/health
      Matcher:
        HttpCode: "200"
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: game-alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: game-alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          Compress: false

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: openai-game-builders-seoul
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/openai-game-builders-seoul
      RetentionInDays: 14
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: openai-game-builders-seoul
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: web
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: "3000"
            - Name: PUBLIC_BASE_URL
              Value: !Sub https://${Distribution.DomainName}
            - Name: GAME_ORIGIN
              Value: !Sub https://${Distribution.DomainName}
            - Name: GAME_BUILD_DIR
              Value: /app/game-dist
            - Name: HIVE_MODE
              Value: !Ref HiveMode
            - Name: HIVE_REDIRECT_URI
              Value: !Sub https://${Distribution.DomainName}/api/v1/auth/hive/callback
            - Name: HIVE_WEB_SHOP_URL
              Value: !Ref HiveWebShopUrl
            - Name: STORE_MODE
              Value: !Ref StoreMode
            - Name: DATA_STORE
              Value: dynamodb
            - Name: DYNAMODB_TABLE
              Value: !Ref DynamoDbTable
            - Name: OPENAI_MODE
              Value: !Ref OpenAiMode
          Secrets:
            - !If
              - HasHiveRuntimeSecrets
              - Name: HIVE_APP_ID
                ValueFrom: !Sub "${RuntimeSecretArn}:HIVE_APP_ID::"
              - !Ref AWS::NoValue
            - !If
              - HasHiveRuntimeSecrets
              - Name: HIVE_CLIENT_ID
                ValueFrom: !Sub "${RuntimeSecretArn}:HIVE_CLIENT_ID::"
              - !Ref AWS::NoValue
            - !If
              - HasHiveRuntimeSecrets
              - Name: HIVE_CLIENT_SECRET
                ValueFrom: !Sub "${RuntimeSecretArn}:HIVE_CLIENT_SECRET::"
              - !Ref AWS::NoValue
            - !If
              - HasOpenAiRuntimeSecrets
              - Name: OPENAI_API_KEY
                ValueFrom: !Sub "${RuntimeSecretArn}:OPENAI_API_KEY::"
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
          HealthCheck:
            Command: [CMD-SHELL, "wget -q -O - http://localhost:3000/api/v1/health || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: web
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref ServiceSecurityGroup]
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

Outputs:
  PublicUrl:
    Value: !Sub https://${Distribution.DomainName}
  HiveRedirectUri:
    Value: !Sub https://${Distribution.DomainName}/api/v1/auth/hive/callback
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
